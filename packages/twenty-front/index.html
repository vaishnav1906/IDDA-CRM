<html lang="en" translate="no" class="light">

    <meta charset="UTF-8" />

    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="IDDA CRM - Lead & Practice Management Platform"
    />

    <meta
      property="og:image"
      content="/images/social-card.png"
    />
    <meta
      property="og:description"
      content="IDDA CRM - Lead & Practice Management Platform"
    />
    <meta property="og:title" content="IDDA CRM" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/images/social-card.png"
    />
    <meta
      name="twitter:description"
      content="IDDA CRM - Lead & Practice Management Platform"
    />
    <meta name="twitter:title" content="IDDA CRM" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&display=swap"
    />

    <title>IDDA CRM</title>

    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector(
          'meta[name=viewport]',
        );

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>

    <style>
      :root {
        --theme-dark-background-tertiary: #1d1d1d;
        --theme-light-background-tertiary: #f1f1f1;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-tertiary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-tertiary);
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
